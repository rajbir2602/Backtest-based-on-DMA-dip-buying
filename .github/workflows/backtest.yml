name: MA Backtest Report

on:
  workflow_dispatch:
    inputs:
      stock_ticker:
        description: 'Stock Ticker to Backtest (e.g. AAPL, MSFT, TSX:RY)'
        required: true
        default: 'AAPL'
  schedule:
    # Runs automatically every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Backtest Script
        env:
          STOCK_TICKER: ${{ github.event.inputs.stock_ticker || 'AAPL' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python backtest.py
